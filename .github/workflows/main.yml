name: Build Mixtape

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          echo "Zips in the repo:"
          find . -iname "*.zip" -not -path "./.git/*"
          ZIP=$(find . -iname "mixtape-v*.zip" -not -path "./.git/*" | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "No versioned Mixtape zip (Mixtape-vX.Y.zip) found."
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf Mixtape
          unzip -q -o "$ZIP"
          grep versionName Mixtape/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: Mixtape
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp Mixtape/app/build/outputs/apk/release/app-release.apk Mixtape-${{ github.run_number }}.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mixtape build ${{ github.run_number }}
          files: Mixtape-${{ github.run_number }}.apk
