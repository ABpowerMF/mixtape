name: Build Mixtape

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          rm -rf Mixtape
          unzip -q -o "$ZIP"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: Mixtape
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp Mixtape/app/build/outputs/apk/release/app-release.apk Mixtape-${{ github.run_number }}.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mixtape build ${{ github.run_number }}
          files: Mixtape-${{ github.run_number }}.apk
